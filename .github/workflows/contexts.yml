name: context to get git hub and runner details
on: push
jobs:
  context:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: all command to get metadata
        run: |
          echo "full branch name: ${{ github.ref }}"
          echo "just branch: ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"
          echo "user: ${{ github.actor }}"
          echo "event: ${{ github.event_name }}"
          echo "runner os: ${{ runner.os }}"
          echo "runner os: ${{ runner.arch }}"

