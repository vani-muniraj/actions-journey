name: artifact
on: push
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: create file
        run: echo "hi" > report.txt
      - name: artifact action
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5
   download:
     needs: artifact
     runs-on: ubuntu-latest
     steps:
       - name: download file
         uses: actions/download-artifact@v4
         with:
           name: build-report
       - name: verify
         run: test -f report.txt
